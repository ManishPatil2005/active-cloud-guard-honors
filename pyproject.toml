[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "active-cloud-guard"
version = "0.5.0"
description = "Honors research: evidence-linked configuration audit and local verification"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3", "jsonschema==4.23.0", "python-hcl2==7.3.1"]

[project.optional-dependencies]
vector = ["chromadb==1.0.20"]
test = ["pytest==9.0.3"]
runtime-ml = ["scikit-learn==1.9.1"]

[project.scripts]
cloudguard = "cloudguard.cli:main"

[tool.setuptools.packages.find]
include = ["cloudguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# Standalone reproduction scripts add the repository root before local imports.
"scripts/*.py" = ["E402"]
